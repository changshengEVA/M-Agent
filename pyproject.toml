[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m-agent"
version = "0.1.0"
description = "M-Agent: a multi-dimensional memory agent for long-term dialogue QA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104,<1.0",
    "langchain>=1.2,<2.0",
    "langgraph>=1.0.10",
    "langgraph-checkpoint>=4.1.1,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0.0",
    "langgraph-prebuilt>=1.0.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
acceptance = [
    "pytest>=8.0",
    "uvicorn>=0.29",
]
[project.scripts]
m-agent-acceptance = "m_agent.acceptance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"m_agent.acceptance" = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --maxfail=1"
markers = [
    "unit: pure logic tests",
    "integration: app-level tests",
    "contract: api contract tests",
    "e2e: end-to-end flow tests",
    "slow: long-running tests",
    "acceptance: deterministic runtime semantic acceptance tests",
    "p2_foundation: deterministic P2 transaction and Scene foundation gate",
]
