# Used by: `m_agent.agents.schedule_agent.ScheduleAgent`
# Purpose: local schedule manager backed by JSON files.
provider: "local_schedule"
default_timezone_name: "Asia/Shanghai"
# Empty means <M_AGENT_DATA_DIR>/schedules (or <M_AGENT_HOME-or-cwd>/data/schedules).
storage_dir: ""

execution:
  query_limit_default: 10
  query_limit_max: 50
