# Per-tool description prompts for the Tool-Suite subsystem.
# Loader picks zh/en by chat_controller.yaml > prompt_language.

tools:

  shallow_recall:
    description:
      zh: "功能：在系统缺失信息时进行单目标情节记忆检索。所需：一个完整问句。"
      en: "Function: single-target episodic lookup when the system lacks information. Needs: one complete question."

  deep_recall:
    description:
      zh: "功能：在系统缺失信息时进行复杂情节记忆检索（比较、计数、多跳、总结、时间链）。所需：一个完整问句。"
      en: "Function: complex episodic lookup when the system lacks information (compare, count, multi-hop, summarize, temporal chains). Needs: one complete question."

  reply_to_user:
    description:
      zh: "功能：向用户发送消息。所需：message。"
      en: "Function: send a message to the user. Needs: message."

  get_current_time:
    description:
      zh: "功能：当前日期、时间、星期及今天/昨天/明天等。所需：无。"
      en: "Function: current date, time, weekday, and relative days such as today, yesterday, and tomorrow. Needs: none."

  web_search:
    description:
      zh: "功能：联网检索公开实时信息，或读取指定网页 URL 的详细页面内容（自动选择 You.com 或 Tavily）。所需：query 和/或 url；可选 max_results、include_content、provider=auto|youcom|tavily。"
      en: "Function: search the public web by query/title or inspect a known webpage URL for detailed page content (auto-selects You.com or Tavily). Needs: query and/or url; optional max_results, include_content, provider=auto|youcom|tavily."

  schedule_create:
    description:
      zh: >
        功能：创建单条时间触发【日程】。所需：具体时间+所执行的具体详细内容（对智能体自己的提醒）。
      en: >
        Function: create one time-triggered schedule. Needs: a specific date/time plus detailed content
        to execute at that time (a reminder for the agent itself).

  schedule_query:
    description:
      zh: >
        功能：检索已有时间触发【日程】（查安排、删前定位、核实创建进度）。所需：keyword（可空，匹配标题/原文）+ start_at/end_at（ISO 时间段，可空表示不限制该边界）。
      en: >
        Function: search existing time-triggered schedules (check plans, locate before delete, verify create progress).
        Needs: keyword (optional, matches title/source text) + start_at/end_at (ISO time range; empty means no bound on that side).

  schedule_delete:
    description:
      zh: "功能：删除（取消）单条日程。所需：schedule_id（sch_ 开头，须来自 schedule_create/schedule_query，禁止编造）。"
      en: "Function: delete (cancel) one schedule. Needs: schedule_id (starts with sch_; must come from schedule_create or schedule_query; never invent)."

  email_ask:
    description:
      zh: "功能：检索 Gmail 并返回 evidence_index。所需：keywords（短词，可空）+ 指定查询未读消息还是全部。"
      en: "Function: search Gmail and return evidence_index. Needs: keywords (short tokens, optional) + whether to search unread only or all mail."

  email_read:
    description:
      zh: "功能：读取指定邮件全文。所需：message_id 或 thread_id（从 email_ask 的 evidence_index 原样复制）。"
      en: "Function: read the full body of one email. Needs: message_id or thread_id (copied exactly from email_ask evidence_index)."

  email_send:
    description:
      zh: "功能：发送单封邮件。所需：收件人邮箱，邮件标题，邮件具体内容。"
      en: "Function: send one email. Needs: recipient address, subject, and body content."
