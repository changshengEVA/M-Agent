# Default Tool-Suite subsystem.
# Each tool owns one manifest under ./capabilities/. This file only composes
# the suite and contains policy that spans multiple tools.
system: tools

capabilities_dir: ./capabilities

# Safe-by-default surface: read operations plus reply emission only.
# Deployments that intentionally permit writes/sends can select
# external_writes_enabled.yaml instead.
enabled:
  - shallow_recall
  - reply_to_user
  - get_current_time
  - web_search
  - schedule_query
  - email_ask
  - email_read

defaults:
  __controller__:
    max_calls_per_turn: 12
  memory_recall:
    max_calls_per_turn: 8
