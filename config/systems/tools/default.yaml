# Default Tool-Suite subsystem.
# Each tool owns one manifest under ./capabilities/. This file only composes
# the suite and contains policy that spans multiple tools.
system: tools

capabilities_dir: ./capabilities

enabled:
  - shallow_recall
  - deep_recall
  - reply_to_user
  - get_current_time
  - web_search
  - schedule_create
  - schedule_query
  - schedule_delete
  - email_ask
  - email_read
  - email_send

defaults:
  __controller__:
    max_calls_per_turn: 12
  memory_recall:
    max_calls_per_turn: 8
