name: schedule_create
version: 2
category: schedule
builder: m_agent.systems.tools.default.capabilities.schedule_ops:_build_schedule_create_tool
descriptions:
  en: "Create one time-triggered deferred objective. Provide an ISO due time and describe the work that will still need to be performed then. Do not state that the work already happened, and do not write the final assistant reply."
  zh: "创建一个按时间触发的延迟目标。提供 ISO 到期时间，并描述届时仍需要执行的工作；不要写成事情已经发生，也不要直接生成最终助手回复。"
input:
  mode: param_llm
  schema: inferred_from_tool
output:
  schema: builtins:dict
  feedback_projector: m_agent.runtime.turn_support.execution_feedback:feedback_summary_from_tool_history
  memory_projector: m_agent.chat.working_memory:project_tool_call_to_entry
policy:
  side_effect: write
dependencies:
  - schedule_agent
defaults:
  timezone_name: Asia/Shanghai
